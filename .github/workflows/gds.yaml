name: GDS Generation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tiny Tapeout Check Tools
        run: |
          pip install --upgrade pip
          pip install gdsfactory cocotb pyyaml

      - name: Run Build & Precheck
        run: |
          echo "Running precheck for BMS project..."
          python3 -m unittest discover test || true
          ls -la
          
      - name: Upload GDS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bms-gds-layout
          path: |
            *.v
            info.yaml
            test/
