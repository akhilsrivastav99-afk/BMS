name: GDS Generation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Coreutils
        run: sudo apt-get update && sudo apt-get install -y coreutils

      - name: Run Tiny Tapeout Action
        uses: tinytapeout/tt-ci-action@v1
