# Tiny Tapeout project information
project:
  title:        "4-Cell Smart BMS Protection Core"
  author:       "Akhil Shrivastava"
  discord:      ""
  description:  "4-cell battery management system with OV/UV/OT/OC protection, single dead-cell bypass, and dual-cell fatal shutdown."
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_".
  top_module:  "tt_um_bms"

  # List your project's source files here (must be inside ./src folder).
  source_files:
    - "tt_um_bms.v"
    - "bms_master.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "ADC Data Bit 0"
  ui[1]: "ADC Data Bit 1"
  ui[2]: "ADC Data Bit 2"
  ui[3]: "ADC Data Bit 3"
  ui[4]: "ADC Data Bit 4"
  ui[5]: "ADC Data Bit 5"
  ui[6]: "ADC Data Bit 6"
  ui[7]: "ADC Data Bit 7"

  # Outputs
  uo[0]: "Cell 1 Bypass MOSFET (byp1)"
  uo[1]: "Cell 2 Bypass MOSFET (byp2)"
  uo[2]: "Cell 3 Bypass MOSFET (byp3)"
  uo[3]: "Cell 4 Bypass MOSFET (byp4)"
  uo[4]: "Charge Enable MOSFET (chg_en)"
  uo[5]: "Discharge Enable MOSFET (dsg_en)"
  uo[6]: "Fault Alert LED / Buzzer"
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "Channel Select Bit 0"
  uio[1]: "Channel Select Bit 1"
  uio[2]: "Channel Select Bit 2"
  uio[3]: "ADC Data Load Enable (load_en)"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6